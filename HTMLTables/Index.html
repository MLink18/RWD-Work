<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title> Table Demo </title>
    <style>
        table,
        tr,
        td {
            border: 1px solid #000;
        }

        table {
            border-collapse: collapse;
        }
    </style>
</head>


<body>

    <table>
        <thead>
            <tr>
                <th>Time</th>
                <th>Topic</th>
                <th>Room</th>
            </tr>
        </thead>
        <tbody>
            <td>8:30</td>
            <td>Responsive</td>
            <td>A3109</td>
        </tbody>
