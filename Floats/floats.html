<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Floating Divs Demo</title>
    <link rel="stylesheet" href="css/floats.css">
  
</head>

<body>
    <h1>Floating Multiple Divs Left and Right</h1>

    <p>This example shows how multiple <code>div</code> elements can float to the left and right inside the same
        container.</p>

    <div class="container">
        <div class="box left">Float Left 1</div>
        <div class="box ltwo">Float Left 2</div>
        <div class="box right">Float Right 1</div>
        <div class="box rtwo">Float Right 2</div>

        <div class="clear"></div>
    </div>

    <div class="note">
        <strong>Important:</strong> The <code>clear: both;</code> div is used so the container wraps around the floated
        boxes properly.
    </div>
</body>

</html>
