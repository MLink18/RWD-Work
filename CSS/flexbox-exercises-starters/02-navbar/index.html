<!DOCTYPE html>
<!--
  EXERCISE 2 — Navbar
  ---------------------------------------------------------------
  Goal: Build a navigation bar with the logo on the far left, the
  links in the middle-right, and a "Sign up" button on the far right.
  Everything should be vertically centered in the bar.

  Properties to practise: justify-content: space-between,
  align-items: center, gap, list-style reset.

  Steps:
  1. Make .navbar a flex container. Push the logo and the right-hand
     group to opposite ends.
  2. Vertically center everything in the bar.
  3. Make the <ul> a flex row with a gap of between links.
     Remove the bullets and default padding.
  4. Make nav a flex row so the links and button sit side by side.

  Bonus: below 600px wide, hide nav and show the menu button.
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercise 2 · Navbar</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="navbar">
    <a href="#" class="logo">FlexMenu</a>

    <nav>
      <ul>
        <li><a href="#">Products</a></li>
        <li><a href="#">Pricing</a></li>
        <li><a href="#">Blog</a></li>
        <li><a href="#">Contact</a></li>
      </ul>
      <a href="#" class="btn">Sign up</a>
      <button class="menu-btn" aria-label="Open menu">☰</button>
    </nav>
  </header>

  <main>
    <h1>Page content</h1>
    <p>Resize the window to check the navbar stays tidy.</p>
  </main>
</body>
</html>
